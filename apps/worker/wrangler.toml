name = "jev-mice"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
# Kept on alongside the custom domain. Declaring a route turns this off by
# default, which took the site down while the new name was still propagating.
workers_dev = true
account_id = "e76a58689ad41afa7ba385f9a1245b63"

# A custom domain rather than a route: Cloudflare creates the DNS record and
# provisions the certificate for it. Note this is a third-level name, which
# universal SSL does not cover -- the Workers custom domain issues its own.
[[routes]]
pattern = "mice.jev.carsonsweet.com"
custom_domain = true

# The built viewer. Everything that is not an API route is served from here.
# Request-level logs, kept by Cloudflare rather than by a beacon in the page.
#
# Web Analytics and this answer different questions and neither substitutes for
# the other. The beacon runs in a browser, so it sees page views, visits,
# countries and referrers -- and only for people whose browser loaded the page
# and ran the script. This sees every request the Worker handled: the API calls,
# the WebSocket upgrades, the status codes, anything that was not a browser, and
# anything that failed before a page ever rendered.
#
# Sampled at 1.0 because the traffic here is tiny and a sample of almost nothing
# tells you almost nothing.
[observability]
enabled = true
head_sampling_rate = 1

[assets]
directory = "../web/dist"
binding = "ASSETS"
# The edge serves a matching asset without invoking the Worker at all, so the
# page itself never reached the HTTPS redirect: /api/capabilities redirected
# and / did not. Running the Worker first costs an invocation per asset and is
# what makes a rule about every request actually apply to every request.
run_worker_first = true
# Any path with no file behind it gets the application, so /runs and
# /runs/<id> are real links. Without this the deployment 404'd on both, which
# is the only reason routing went through the hash.
not_found_handling = "single-page-application"


[[durable_objects.bindings]]
name = "RUN"
class_name = "RunDO"

[[durable_objects.bindings]]
name = "BUDGET"
class_name = "BudgetDO"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "RegistryDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RunDO", "BudgetDO", "RegistryDO"]

[[r2_buckets]]
binding = "RECORDS"
bucket_name = "jev-mice-records"

[vars]
# Dollars a day across every visitor, and the price the ceiling is derived from.
#
# The price is TypeSafe's published figure, read from docs.typesafe.ai/models on
# 2026-09-21: "$42 / $0.042" per Btok / per Mtok, input only, output free. It was
# 0.28 here, a guess from the requirements' own cost estimate and 6.7 times too
# high, which made a $20 ceiling behave like $3. At the real price $20 a day is
# roughly 98 full default runs.
#
# Change these and redeploy; no code knows the number.
JEV_DAILY_BUDGET_USD = "20"
JEV_PRICE_PER_MTOK = "0.042"

# Cloudflare Web Analytics. Cookieless, no cross-site identity. Empty means no
# beacon is injected, which is what local development gets.
CF_ANALYTICS_TOKEN = "8966086a6b1c4568a6cec4c593ff5160"

# The longest run this deployment allows. The engine permits 20,000, which with
# Jev deciding is nearly an hour of one slot; on a URL anyone can start work on,
# 10,000 is enough to see a colony settle or fail.
MAX_TICKS = "10000"

# TYPESAFE_API_KEY is a secret, set with: wrangler secret put TYPESAFE_API_KEY
