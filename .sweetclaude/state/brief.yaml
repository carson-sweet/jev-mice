key_decisions:
- Fixed grid presets replace the screen-size mouse cap; caps derive from grid area
- Six open mechanics settled with proposed values (food respawn 40 ticks configurable,
  gestation 60, litter 2-4 at 60 percent nutrition, cap-limited births lost, trap
  relocates on respawn, cat rest 10 and patience 30, perception 6 mice and 8 cats)
- 'Four personality types: bold, cautious, vigilant, social; percentages applied at
  spawn and birth; no inheritance in v1'
- Baseline mode and config export accepted into scope; personality-survival view deferred
  until inheritance exists
- 'Telemetry: typed event stream, IndexedDB run records, JSON export, replay from
  logged Jev responses, comparison between records only'
- Ten true/false success criteria including a numeric flee-or-hide guard against Brownian
  motion
- Mouseholes as shelter, hiding place, breeding gate, and nursery (v1.2)
- No repository license; private repository (v1.3)
- Hosted multi-tenant service with accounts, server-side simulation, library, and
  sharing (v2.0)
