style: monolith
tech_stack:
  language: TypeScript
  framework: Hono on Cloudflare Workers (API, Durable Objects); Node in Cloudflare
    Containers (simulation); React 19 + Vite (viewer); engine as standalone package
  database: Neon Postgres 17 via serverless driver + Drizzle; KV sessions; R2 chunked
    run records and summaries; Durable Object counters
  deployment: Cloudflare Workers with static assets plus Containers via wrangler;
    local dev via @cloudflare/vite-plugin
compliance_requirements:
- pii_minimal_scopes_and_fields
- no_analytics_or_tracking
- secrets_server_side_only
- secure_httponly_sessions
- authorization_on_every_run_route
- jev_payload_validation
- container_callback_token
